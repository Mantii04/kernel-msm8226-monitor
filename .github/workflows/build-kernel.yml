name: Build Monitor Mode Kernel (GT-I9301I)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ARCH: arm
  KBUILD_BUILD_USER: "builder"
  KBUILD_BUILD_HOST: "github-ci"
  DEFCONFIG: lineage_s3ve3gxx_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout patch scripts
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            build-essential git ccache perl python3 \
            wget xz-utils zip tar

      - name: Download AOSP GCC 4.9 toolchain
        run: |
          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-eabi-4.9/+archive/master.tar.gz -O arm-eabi-4.9.tar.gz
          mkdir -p arm-eabi-4.9
          tar xzf arm-eabi-4.9.tar.gz -C arm-eabi-4.9
          TOOLCHAIN="$(pwd)/arm-eabi-4.9/bin/arm-eabi-"
          echo "TOOLCHAIN=$TOOLCHAIN" >> $GITHUB_ENV
          ${TOOLCHAIN}gcc --version

      - name: Clone LineageOS kernel source
        run: |
          git clone --depth=1 -b lineage-18.1 \
            https://github.com/LineageOS/android_kernel_samsung_msm8226.git
          cd android_kernel_samsung_msm8226
          head -5 Makefile

      - name: Apply monitor mode patches
        run: |
          cd android_kernel_samsung_msm8226
          cp ../monitor_mode_patch.py .
          python3 monitor_mode_patch.py

      - name: Disable module verification and fix vermagic
        run: |
          cd android_kernel_samsung_msm8226
          DEFCONFIG=arch/arm/configs/lineage_s3ve3gxx_defconfig
          sed -i 's/CONFIG_MODVERSIONS=y/# CONFIG_MODVERSIONS is not set/' $DEFCONFIG
          sed -i '/CONFIG_LOCALVERSION=/d' $DEFCONFIG
          sed -i '/CONFIG_LOCALVERSION_AUTO=/d' $DEFCONFIG
          echo "CONFIG_LOCALVERSION="-g3fa1853ed5d"" >> $DEFCONFIG
          echo "# CONFIG_LOCALVERSION_AUTO is not set" >> $DEFCONFIG
          echo "-g3fa1853ed5d" > .scmversion
          git add -A
          git config user.email "builder@ci.local"
          git config user.name "CI Builder"
          git commit -m "patches" --allow-empty

      - name: Configure kernel
        run: |
          cd android_kernel_samsung_msm8226
          make ARCH=arm CROSS_COMPILE="${{ env.TOOLCHAIN }}" $DEFCONFIG

      - name: Build kernel image and modules
        run: |
          cd android_kernel_samsung_msm8226
          set -o pipefail
          make ARCH=arm CROSS_COMPILE="${{ env.TOOLCHAIN }}" -j$(nproc) zImage modules 2>&1 | tee build.log

      - name: Build dtbs
        run: |
          cd android_kernel_samsung_msm8226
          set -o pipefail
          make ARCH=arm CROSS_COMPILE="${{ env.TOOLCHAIN }}" -j$(nproc) dtbs 2>&1 | tee -a build.log
          DTB=$(find arch/arm/boot -name "*s3ve3g*.dtb" | head -1)
          if [ -n "$DTB" ]; then
            cp "$DTB" arch/arm/boot/dt.img
          fi

      - name: Show build errors if any
        if: always()
        run: |
          cd android_kernel_samsung_msm8226
          echo "=== Errors from build.log ==="
          grep -i "error:" build.log | tail -30 || echo "No errors found"
          echo "=== Build artifacts ==="
          ls -lh arch/arm/boot/zImage 2>/dev/null || echo "zImage NOT found"
          find . -name "wlan.ko" -exec ls -lh {} \; 2>/dev/null || echo "wlan.ko NOT found"

      - name: Package artifacts
        run: |
          cd android_kernel_samsung_msm8226
          mkdir -p ../output
          cp arch/arm/boot/zImage ../output/ 2>/dev/null || true
          cp arch/arm/boot/dt.img ../output/ 2>/dev/null || true
          find . -name "wlan.ko" -exec cp {} ../output/ \; 2>/dev/null || true
          cp build.log ../output/ 2>/dev/null || true
          cd ../output
          zip -r ../monitor-mode-kernel-build.zip .
          cd ..
          ls -lh monitor-mode-kernel-build.zip

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-mode-kernel-build
          path: |
            output/
            monitor-mode-kernel-build.zip
          retention-days: 30
