name: Build Monitor Mode Kernel (GT-I9301I)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ARCH: arm
  KBUILD_BUILD_USER: "builder"
  KBUILD_BUILD_HOST: "github-ci"
  DEFCONFIG: lineage_s3ve3gxx_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout patch scripts
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            build-essential git ccache perl python3 \
            wget xz-utils zip gcc-arm-linux-gnueabi

      - name: Verify toolchain
        run: |
          arm-linux-gnueabi-gcc --version
          echo "TOOLCHAIN=arm-linux-gnueabi-" >> $GITHUB_ENV

      - name: Clone LineageOS kernel source
        run: |
          git clone --depth=1 -b lineage-18.1 \
            https://github.com/LineageOS/android_kernel_samsung_msm8226.git
          cd android_kernel_samsung_msm8226
          head -5 Makefile
          echo "Kernel source ready"

      - name: Patch kernel for GCC 11 compatibility
        run: |
          cd android_kernel_samsung_msm8226
          LATEST=$(ls include/linux/compiler-gcc*.h 2>/dev/null | sort -V | tail -1)
          echo "Latest compiler header found: $LATEST"
          cp "$LATEST" include/linux/compiler-gcc11.h
          echo "Created compiler-gcc11.h from $LATEST"
          sed -i 's/^KBUILD_CFLAGS   := -Wall/KBUILD_CFLAGS   := -Wall -fcommon -Wno-error -Wno-implicit-function-declaration -Wno-unused-but-set-variable -Wno-misleading-indentation -Wno-maybe-uninitialized -Wno-address-of-packed-member -Wno-stringop-truncation -Wno-array-bounds -Wno-packed-not-aligned/' Makefile
          echo "Patched KBUILD_CFLAGS"

      - name: Apply monitor mode patches
        run: |
          cd android_kernel_samsung_msm8226
          cp ../monitor_mode_patch.py .
          python3 monitor_mode_patch.py

      - name: Verify patches applied
        run: |
          cd android_kernel_samsung_msm8226
          echo "=== Checking interface_modes ==="
          grep -n "NL80211_IFTYPE_MONITOR" drivers/staging/prima/CORE/HDD/src/wlan_hdd_cfg80211.c | head -5
          echo ""
          echo "=== Checking .set_channel in ops ==="
          grep -n -B1 -A1 "set_channel" drivers/staging/prima/CORE/HDD/src/wlan_hdd_cfg80211.c | head -10
          echo ""
          echo "=== Checking con_mode gate removed ==="
          grep -c "if (VOS_MONITOR_MODE == hdd_get_conparam())" drivers/staging/prima/CORE/HDD/src/wlan_hdd_cfg80211.c || echo "Gate removed: 0 matches"

      - name: Configure kernel
        run: |
          cd android_kernel_samsung_msm8226
          make ARCH=arm CROSS_COMPILE="${{ env.TOOLCHAIN }}" $DEFCONFIG

      - name: Build kernel modules
        run: |
          cd android_kernel_samsung_msm8226
          make ARCH=arm CROSS_COMPILE="${{ env.TOOLCHAIN }}" -j$(nproc) modules 2>&1 | tee build.log | tail -100

      - name: Verify wlan.ko built
        run: |
          cd android_kernel_samsung_msm8226
          echo "=== WLAN module ==="
          find . -name "wlan.ko" -exec ls -lh {} \; 2>/dev/null || echo "wlan.ko NOT found"
          echo ""
          echo "=== All .ko modules ==="
          find . -name "*.ko" -exec ls -lh {} \; 2>/dev/null | head -20
          echo ""
          WLAN_KO=$(find . -name "wlan.ko" | head -1)
          if [ -n "$WLAN_KO" ]; then
            echo "=== BUILD SUCCESSFUL ==="
            echo "Module: $WLAN_KO"
            echo ""
            echo "=== vermagic ==="
            strings "$WLAN_KO" | grep -i "vermagic" | head -5
            echo ""
            echo "=== module info ==="
            strings "$WLAN_KO" | grep -i "depends\|license\|author" | head -10
          else
            echo "=== BUILD FAILED ==="
            tail -80 build.log
            exit 1
          fi

      - name: Package artifacts
        run: |
          cd android_kernel_samsung_msm8226
          mkdir -p ../output
          find . -name "wlan.ko" -exec cp {} ../output/ \; 2>/dev/null || true
          cp build.log ../output/ 2>/dev/null || true
          cd ../output
          ls -lh
          zip -r ../wlan-monitor-mode.zip .
          cd ..
          ls -lh wlan-monitor-mode.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wlan-monitor-mode
          path: |
            output/
            wlan-monitor-mode.zip
          retention-days: 30

      - name: Create release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: monitor-mode-${{ github.run_number }}
          name: Monitor Mode wlan.ko Build #${{ github.run_number }}
          files: wlan-monitor-mode.zip
          body: |
            Monitor mode wlan.ko for GT-I9301I (S3 Neo) on LineageOS 18.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
